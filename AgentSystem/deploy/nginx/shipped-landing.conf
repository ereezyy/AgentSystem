# Staging proposal only (claim 0046): serve one static shipped-products landing page.
# This file is intended to replace only dead-air.show, agentlooper.org, proofchain.us,
# and self.proofchain.us server blocks. Do not modify unrelated vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name dead-air.show agentlooper.org proofchain.us self.proofchain.us;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dead-air.show agentlooper.org proofchain.us self.proofchain.us;

    # Keep cert paths aligned with existing host certs on target server.
    # Replace placeholders below with the exact current values before deploy.
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_EXISTING_CERT/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_EXISTING_CERT/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/shipped;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

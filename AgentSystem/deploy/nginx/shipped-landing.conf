# Staging proposal only (claim 0046): serve one static shipped-products landing page.
# This file is intended to replace the existing dead-air.show vhost only.
# Do not modify unrelated vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name dead-air.show www.dead-air.show;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-dead-air;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dead-air.show www.dead-air.show;

    ssl_certificate /etc/letsencrypt/live/dead-air.show/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dead-air.show/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/shipped;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;
    }

    location ~* (^|/)\.git {
        deny all;
    }

    location ~* (^|/)\.env {
        deny all;
    }

    location ~* \.bak$ {
        deny all;
    }

    location /legal/ {
        alias /opt/legal/;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /robots.txt {
        alias /opt/legal/robots.txt;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" always;
    }

    location /rss {
        return 410;
    }

    location /podcast/ {
        return 410;
    }

    location /episodes/ {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

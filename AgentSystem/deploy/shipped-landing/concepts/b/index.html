<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eddy Woods LLC | Product Metamorphosis</title>
  <meta name="description" content="A continuous interactive timeline of everything Eddy Woods has shipped, from first product to latest.">
  <meta name="theme-color" content="#071018">
  <style>
    :root {
      --bg: #071018;
      --ink: #ebf7ff;
      --muted: #9eb8c9;
      --line: rgba(112, 210, 240, 0.3);
      --cyan: #62d4ff;
      --cyan-2: #49bde1;
      --focus: #a8edff;
      --progress: 0;
      --step: 0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 22%, rgba(89, 208, 242, 0.17), transparent 32%),
        radial-gradient(circle at 84% 78%, rgba(52, 174, 206, 0.15), transparent 40%),
        var(--bg);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.45;
    }
    a { color: inherit; }
    .skip-link {
      position: absolute;
      top: -3rem;
      left: 0.75rem;
      z-index: 15;
      background: #fff;
      color: #000;
      border-radius: 0.5rem;
      padding: 0.55rem 0.7rem;
    }
    .skip-link:focus { top: 0.65rem; }
    main {
      width: min(1180px, calc(100% - 1.4rem));
      margin: 0 auto;
      padding: 1.1rem 0 2.2rem;
    }
    .frame {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 1.05rem;
      background: linear-gradient(170deg, rgba(10, 20, 33, 0.92), rgba(6, 13, 23, 0.95));
      box-shadow: 0 24px 66px rgba(3, 8, 16, 0.56);
    }
    .kicker {
      margin: 0;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c8e7f5;
      font-weight: 600;
    }
    h1 {
      margin: 0.58rem 0 0;
      font-size: clamp(1.7rem, 5vw, 3rem);
      line-height: 1.08;
      text-wrap: balance;
    }
    .lede {
      margin: 0.8rem 0 1rem;
      max-width: 64ch;
      color: var(--muted);
      font-size: clamp(0.98rem, 2.4vw, 1.06rem);
    }
    .scrub {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 0.95rem;
    }
    .scrub label {
      font-size: 0.86rem;
      color: #c0e8f6;
    }
    .timeline {
      appearance: none;
      width: 100%;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(109, 205, 237, 0.35);
      padding: 0 0.6rem;
      background: linear-gradient(90deg, rgba(98, 212, 255, 0.13), rgba(98, 212, 255, 0.03));
    }
    .timeline::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #b7f1ff;
      background: radial-gradient(circle at 30% 30%, #e4f9ff, #62d4ff);
      box-shadow: 0 0 0 6px rgba(98, 212, 255, 0.22);
    }
    .timeline::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #b7f1ff;
      background: radial-gradient(circle at 30% 30%, #e4f9ff, #62d4ff);
      box-shadow: 0 0 0 6px rgba(98, 212, 255, 0.22);
    }
    .experience {
      display: grid;
      gap: 1rem;
    }
    .stage {
      min-height: 540px;
      border-radius: 22px;
      border: 1px solid rgba(118, 211, 240, 0.24);
      background: radial-gradient(circle at 50% 20%, rgba(94, 210, 245, 0.12), transparent 45%), rgba(8, 15, 25, 0.9);
      overflow: hidden;
      position: relative;
    }
    .stage-inner {
      position: sticky;
      top: 0.5rem;
      min-height: 539px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 0.7rem;
      padding: 0.8rem;
    }
    .artifact {
      border-radius: 16px;
      border: 1px solid rgba(120, 214, 242, 0.32);
      background: linear-gradient(165deg, rgba(12, 27, 41, 0.94), rgba(7, 16, 28, 0.96));
      position: relative;
      overflow: hidden;
    }
    .layers {
      list-style: none;
      margin: 0;
      padding: 0;
      position: absolute;
      inset: 0;
    }
    .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      display: grid;
      place-items: center;
      transition: opacity 520ms cubic-bezier(.2,.65,.2,1), transform 520ms cubic-bezier(.2,.65,.2,1);
      transform: scale(0.96) translateY(12px);
      pointer-events: none;
    }
    .layer svg { width: min(80%, 360px); height: auto; display: block; }
    .layer.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .copy {
      border-radius: 16px;
      border: 1px solid rgba(118, 210, 240, 0.26);
      background: rgba(10, 21, 35, 0.9);
      padding: 0.95rem;
      display: grid;
      align-content: start;
      gap: 0.68rem;
    }
    .step-label {
      color: #bde6f5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.72rem;
      margin: 0;
    }
    .copy h2 {
      margin: 0;
      font-size: clamp(1.4rem, 4.4vw, 2.2rem);
      line-height: 1.1;
    }
    .lisa-lines p {
      margin: 0.4rem 0 0;
      color: #d2eff9;
    }
    .cta {
      margin-top: auto;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(147, 227, 251, 0.45);
      text-decoration: none;
      color: #d8f4ff;
      background: linear-gradient(180deg, rgba(16, 35, 51, 0.95), rgba(10, 22, 35, 0.95));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 0.9rem;
      font-weight: 600;
      transition: transform 180ms ease, border-color 180ms ease;
    }
    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(176, 238, 255, 0.95);
      outline: none;
    }
    .fallback {
      margin: 0.2rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.55rem;
    }
    .fallback a {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(128, 217, 245, 0.35);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      padding: 0.65rem 0.75rem;
      background: rgba(11, 24, 37, 0.74);
      color: #d9f3ff;
    }
    footer {
      margin-top: 0.95rem;
      text-align: center;
      font-size: 0.88rem;
      color: #aad1df;
    }
    footer a, footer a:visited {
      color: #88e4ff;
      text-decoration: underline;
      text-underline-offset: 0.18em;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 0.54rem;
      border-radius: 8px;
    }
    footer a:hover,
    footer a:focus-visible {
      color: #c4f4ff;
      background: rgba(89, 205, 238, 0.14);
      outline: none;
    }
    .focus-ring:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    @media (max-width: 900px) {
      .stage-inner {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .artifact { min-height: 260px; }
      .copy { min-height: 260px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .layer { transition: none; }
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link focus-ring" href="#product-copy">Skip to products</a>
  <main>
    <section class="frame" aria-labelledby="title">
      <p class="kicker">Eddy Woods LLC</p>
      <h1 id="title">A single line of shipped work, continuously transforming.</h1>
      <p class="lede">Scroll or scrub the timeline to watch one artifact evolve through every shipped product, then open any destination directly.</p>
      <div class="scrub">
        <label for="timeline">Transformation timeline</label>
        <input id="timeline" class="timeline focus-ring" type="range" min="0" max="6" step="0.01" value="0">
      </div>
      <div class="experience">
        <div class="stage" id="stage">
          <div class="stage-inner">
            <div class="artifact" aria-hidden="true">
              <ul class="layers" id="layers">
                <li class="layer active"><svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="110" fill="none" stroke="#62d4ff" stroke-width="12"/><circle cx="205" cy="115" r="22" fill="#9eeeff"/><path d="M72 184C110 126 220 126 248 78" stroke="#c9f5ff" stroke-width="11" fill="none" stroke-linecap="round"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><rect x="66" y="66" width="188" height="188" rx="54" fill="none" stroke="#62d4ff" stroke-width="12"/><path d="M88 206L123 116L160 186L197 102L232 206" stroke="#e1faff" stroke-width="11" fill="none" stroke-linecap="round"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><path d="M44 188C86 90 122 262 164 188C206 90 242 262 276 188" fill="none" stroke="#62d4ff" stroke-width="13" stroke-linecap="round"/><rect x="56" y="226" width="208" height="22" rx="11" fill="#d8f7ff"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><circle cx="160" cy="118" r="44" fill="none" stroke="#62d4ff" stroke-width="12"/><path d="M72 252C85 196 122 170 160 170C198 170 235 196 248 252" fill="none" stroke="#dff9ff" stroke-width="12" stroke-linecap="round"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><path d="M160 48L252 202H68L160 48Z" fill="none" stroke="#62d4ff" stroke-width="12"/><path d="M160 116V272" stroke="#ddf9ff" stroke-width="12" stroke-linecap="round"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><circle cx="130" cy="130" r="66" fill="none" stroke="#62d4ff" stroke-width="12"/><path d="M180 182L260 262" stroke="#dff9ff" stroke-width="12" stroke-linecap="round"/><path d="M98 130L122 156L162 110" stroke="#dff9ff" stroke-width="10" fill="none"/></svg></li>
                <li class="layer"><svg viewBox="0 0 320 320"><rect x="60" y="60" width="200" height="200" rx="56" fill="none" stroke="#62d4ff" stroke-width="12"/><path d="M102 160H218M160 102V218" stroke="#e4fbff" stroke-width="12" stroke-linecap="round"/></svg></li>
              </ul>
            </div>
            <div class="copy" id="product-copy">
              <p class="step-label" id="stepLabel">1 / 7</p>
              <h2 id="productName">DistroBuzz</h2>
              <div id="lisaSlot"></div>
              <a id="openLink" class="cta focus-ring" href="https://waveforge.net" target="_blank" rel="noopener noreferrer">Open WaveForge</a>
            </div>
          </div>
        </div>
        <noscript>
          <ul class="fallback">
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">DistroBuzz — Open WaveForge</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">Maestro — Open WaveForge</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">WaveForge — Open WaveForge</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">Lisa<br>Your personal AI assistant<br>A genuinely helpful assistant with lots of awesome integrations and modern AI under the hood.</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">Social Forest — Open WaveForge</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">Small agentlooper.org tools — Open WaveForge</a></li>
            <li><a href="https://waveforge.net" target="_blank" rel="noopener noreferrer">HVACFix — Open WaveForge</a></li>
          </ul>
        </noscript>
      </div>
    </section>
    <footer>
      <span id="year"></span> Eddy Woods LLC
      <span aria-hidden="true"> · </span>
      <a href="/legal/privacy">Privacy</a>
      <span aria-hidden="true"> · </span>
      <a href="/legal/terms">Terms</a>
    </footer>
  </main>
  <script>
    (function () {
      var names = [
        "DistroBuzz",
        "Maestro",
        "WaveForge",
        "Lisa",
        "Social Forest",
        "Small agentlooper.org tools",
        "HVACFix"
      ];
      var timeline = document.getElementById("timeline");
      var layers = Array.prototype.slice.call(document.querySelectorAll(".layer"));
      var name = document.getElementById("productName");
      var stepLabel = document.getElementById("stepLabel");
      var lisaSlot = document.getElementById("lisaSlot");
      var stage = document.getElementById("stage");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var lockSlider = false;
      function render(indexFloat) {
        var clamped = Math.max(0, Math.min(6, indexFloat));
        var index = Math.round(clamped);
        layers.forEach(function (layer, i) {
          layer.classList.toggle("active", i === index);
        });
        name.textContent = names[index];
        stepLabel.textContent = String(index + 1) + " / 7";
        if (index === 3) {
          lisaSlot.className = "lisa-lines";
          lisaSlot.innerHTML = "<p><strong>Your personal AI assistant</strong></p><p>A genuinely helpful assistant with lots of awesome integrations and modern AI under the hood.</p>";
        } else {
          lisaSlot.className = "";
          lisaSlot.innerHTML = "";
        }
      }
      timeline.addEventListener("input", function () {
        lockSlider = true;
        render(Number(timeline.value));
      });
      if (!reduce) {
        window.addEventListener("scroll", function () {
          if (lockSlider) return;
          var rect = stage.getBoundingClientRect();
          var viewport = window.innerHeight;
          var start = viewport * 0.15;
          var end = Math.max(start + 1, rect.height - viewport * 0.25);
          var progress = Math.max(0, Math.min(1, (start - rect.top) / end));
          var value = progress * 6;
          timeline.value = value.toFixed(2);
          render(value);
        }, { passive: true });
      }
      var fromQuery = Number(new URLSearchParams(window.location.search).get("step"));
      if (!Number.isNaN(fromQuery)) {
        timeline.value = Math.max(0, Math.min(6, fromQuery));
        render(Number(timeline.value));
      } else {
        render(0);
      }
    })();
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
